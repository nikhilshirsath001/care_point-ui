<div class="page-container">

  <app-shared-table
    [title]="'Medications'"
    [subtitle]="'Manage hospital medications'"
    [columns]="medicationColumns"
    [data]="filteredMedications()"
    [config]="tableConfig"
    [totalRecords]="totalRecords()"
    (view)="viewMedication($event)"
    (pageChange)="onPageChange($event)"
    (refresh)="onRefresh()"
    (edit)="editMedication($event)"
    (delete)="deleteMedication($event)"
    (searchRecord)="onSearch($event)"
    (createNewRecord)="createNewMedication()"
  >
  </app-shared-table>

  <app-shared-details
    [(visible)]="viewDialogVisible"
    [title]="'Medication Details'"
    [data]="selectedMedication()"
    [fields]="medicationDetailsFields"
  >
  </app-shared-details>

  <p-dialog
    [(visible)]="showForm"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [closable]="true"
    [dismissableMask]="true"
    [style]="{ width: '700px', maxWidth: '95vw' }"
    [header]="formMode === 'create' ? 'Create Medication' : 'Edit Medication'"
  >
    <app-medication-form
      *ngIf="showForm"
      [mode]="formMode"
      [medication]="selectedMedication()"
      (saved)="onMedicationSaved()"
      (cancelled)="onFormCancelled()"
    >
    </app-medication-form>
  </p-dialog>
</div>
