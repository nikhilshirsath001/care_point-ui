
<div class="page-container">

  <div
    class="d-flex justify-content-between align-items-center mb-4"
  >

    <div>
      <h2 class="mb-1">
        Staff Availability
      </h2>

      <p class="text-muted mb-0">
        Manage hospital Staff Availability.
      </p>
    </div>


  </div>



  <app-shared-table
  [title]="'Doctors & Staff Availability'"
  [subtitle]="'Manage registered Doctors & Staff'"
  [columns]="patientColumns"
  [data]="staffList"
  [config]="tableConfig"

  (view)="onViewStaff($event)"
  >
  </app-shared-table>


  <app-shared-details
  [(visible)]="viewDialogVisible"
  [title]="'Staff Details'"
  [data]="selectedStaff"
  [fields]="staffDetailFields">
</app-shared-details>
</div>
