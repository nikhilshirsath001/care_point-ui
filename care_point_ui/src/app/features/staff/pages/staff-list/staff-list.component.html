<p-tabs [(value)]="activeTab" (valueChange)="onTabChange($event)">
  <p-tablist>
    <p-tab value="0">Active Staff</p-tab>
    <p-tab value="1">Inactive Staff</p-tab>
  </p-tablist>

  <p-tabpanels>
    <p-tabpanel value="0">
    <app-shared-table
      [title]="'Staff'"
      [subtitle]="'Manage registered Doctors & Staff'"
      [columns]="patientColumns"
      [data]="activeStaffList"
      [config]="activeTableConfig"
      (view)="onViewTable($event)"
      (createNewRecord)="onCreateTable()"
      (pageChange)="onPageChangeTable($event)"
      (refresh)="onRefreshTable()"
      (edit)="OnEditTable($event)"
      (deactivate)="onDeactivateTable($event)"
      (searchRecord)="onSearchTable($event)"
    />
  </p-tabpanel>

    <p-tabpanel value="1">
    <app-shared-table
      [title]="'Staff'"
      [subtitle]="'Manage registered Doctors & Staff'"
      [columns]="patientColumns"
      [data]="inactiveStaffList"
      [config]="inactiveTableConfig"
      (view)="onViewTable($event)"
      (createNewRecord)="onCreateTable()"
      (pageChange)="onPageChangeTable($event)"
      (refresh)="onRefreshTable()"
      (edit)="OnEditTable($event)"
      (delete)="onDeleteRecordPermanently($event)"
      (activate)="onDeactivateTable($event)"
    />
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>

<p-dialog
  [(visible)]="showForm"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{
    width: '750px',
    maxWidth: '95vw',
  }"
  [header]="formMode === 'create' ? 'Create Staff' : 'Edit Staff'"
>
  <app-dynamic-form
    [mode]="formMode"
    [data]="selectedStaff"
    [config]="staffFormFields"
    (submitted)="onStaffSaved($event)"
    (cancelled)="onFormCancelled()"
    (reset)="onFormReset()"
  />
</p-dialog>

<app-shared-details
  [(visible)]="viewDialogVisible"
  [title]="'Staff Details'"
  [data]="selectedStaff"
  [fields]="staffDetailFields"
/>
