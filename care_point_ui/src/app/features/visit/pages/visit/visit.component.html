<div class="page-container">

  <app-shared-table
    [title]="'Visits'"
    [subtitle]="'Search patient visits using ABHA ID'"
    [columns]="visitColumns"
    [data]="filteredVisits"
    [config]="tableConfig"
    (view)="onViewVisit($event)"
    (edit)="openEditForm($event)"
    (searchRecord)="onSearch($event)"
    (refresh)="loadVisits()"
    (createNewRecord)="openCreateForm()"
  >
  </app-shared-table>

  <p-dialog
    [(visible)]="showForm"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [closable]="true"
    [dismissableMask]="true"
    [style]="{
      width: '750px',
      maxWidth: '95vw',
    }"
    [header]="formMode === 'create' ? 'Create Visit' : 'Edit Visit'"
  >
    <app-visit-form
      *ngIf="showForm"
      [mode]="formMode"
      [visit]="selectedVisit"
      (saved)="onVisitSaved()"
      (cancelled)="onFormCancelled()"
    >
    </app-visit-form>
  </p-dialog>

  <app-shared-details
    [(visible)]="showDetails"
    [title]="'Visit Details'"
    [data]="selectedVisit"
    [fields]="visitDetailFields"
  >
  </app-shared-details>
</div>
