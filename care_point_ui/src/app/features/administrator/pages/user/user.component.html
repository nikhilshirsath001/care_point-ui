<div class="page-container">

  <!-- ====================================================== -->
  <!-- USER TABLE -->
  <!-- ====================================================== -->

  <app-shared-table
    [title]="'Users'"
    [subtitle]="'Manage hospital users'"
    [columns]="userColumns"
    [data]="filteredUsers()"
    [config]="tableConfig"
    [totalRecords]="totalRecords()"
    (view)="viewUser($event)"
    (edit)="editUser($event)"
    (delete)="deleteUser($event)"
    (pageChange)="onPageChange($event)"
    (refresh)="onRefresh()"
    (searchRecord)="onSearch($event)"
  >
  </app-shared-table>

  <!-- ====================================================== -->
  <!-- CREATE / EDIT USER -->
  <!-- ====================================================== -->

  <p-dialog
    [(visible)]="showForm"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [closable]="true"
    [dismissableMask]="true"
    [style]="{
      width: '700px',
      maxWidth: '95vw',
    }"
    [header]="formMode === 'create' ? 'Create User' : 'Edit User'"
  >
    <app-user-form
      *ngIf="showForm"
      [mode]="formMode"
      [user]="selectedUser()"
      (saved)="onUserSaved()"
      (cancelled)="onFormCancelled()"
    >
    </app-user-form>
  </p-dialog>

  <!-- ====================================================== -->
  <!-- VIEW USER -->
  <!-- ====================================================== -->

  <app-shared-details
    [(visible)]="viewDialogVisible"
    [title]="'User Details'"
    [data]="selectedUser()"
    [fields]="userDetailsFields"
  >
  </app-shared-details>
</div>
