<div class="page-container">

  <!-- PAGE HEADER -->
  <div
    class="d-flex justify-content-between align-items-center mb-4"
  >

    <div>
      <h2 class="mb-1">
        Department Management
      </h2>

      <p class="text-muted mb-0">
        Manage hospital Departments and their availability.
      </p>
    </div>

    <button
      pButton
      label="Add Department"
      icon="pi pi-plus"
      (click)="openCreateForm()"
    ></button>

  </div>


  <!-- BED TABLE -->

  <app-shared-table
    [title]="'Departments'"
    [subtitle]="'Manage registered Departments'"
    [columns]="departmentColumns"
    [data]="departmentList"
    [config]="tableConfig"
  >
  </app-shared-table>


  <!-- BED FORM -->

  <p-dialog
    [(visible)]="showForm"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{
      width: '750px',
      maxWidth: '95vw'
    }"
    [header]="formMode === 'create'
      ? 'Create Bed'
      : 'Edit Bed'"
  >

    <app-department-form
      [mode]="formMode"
      [bed]="selectedBed"
      (saved)="onBedSaved()"
      (cancelled)="onFormCancelled()"
    >
    </app-department-form>

  </p-dialog>

</div>
