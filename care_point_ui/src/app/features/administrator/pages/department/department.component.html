<div class="page-container">

  <!-- BED TABLE -->

  <app-shared-table
    [title]="'Departments'"
    [subtitle]="'Manage registered Departments'"
    [columns]="departmentColumns"
    [data]="departmentList"
    [config]="tableConfig"
    (createNewRecord)="openCreateForm()"
  >
  </app-shared-table>


  <!-- BED FORM -->

  <p-dialog
    [(visible)]="showForm"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{
      width: '750px',
      maxWidth: '95vw'
    }"
    [header]="formMode === 'create'
      ? 'Create Bed'
      : 'Edit Bed'"
  >

    <app-department-form
      [mode]="formMode"
      [bed]="selectedBed"
      (saved)="onBedSaved()"
      (cancelled)="onFormCancelled()"
    >
    </app-department-form>

  </p-dialog>

</div>
