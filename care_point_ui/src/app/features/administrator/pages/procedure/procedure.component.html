<div class="page-container">
  <!-- PAGE HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">Procedure Management</h2>

      <p class="text-muted mb-0">
        Manage hospital Procedure and their availability.
      </p>
    </div>

    <button
      pButton
      label="Add Procedure"
      icon="pi pi-plus"
      (click)="openCreateForm()"
    ></button>
  </div>

  <app-shared-table
    [title]="'Doctors & Procedure'"
    [subtitle]="'Manage registered Doctors & Procedure'"
    [columns]="patientColumns"
    [data]="procedureList"
    [config]="tableConfig"
    (view)="onViewProcedure($event)"
  >
  </app-shared-table>

  <!-- BED FORM -->

  <p-dialog
    [(visible)]="showForm"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{
      width: '750px',
      maxWidth: '95vw',
    }"
    [header]="formMode === 'create' ? 'Create Procedure' : 'Edit Procedure'"
  >
    <app-procedure-form
      [mode]="formMode"
      [procedure]="selectedProcedure"
      (saved)="onProcedureSaved()"
      (cancelled)="onFormCancelled()"
    >
    </app-procedure-form>
  </p-dialog>

  <app-shared-details
    [(visible)]="viewDialogVisible"
    [title]="'Procedure Details'"
    [data]="selectedProcedure"
    [fields]="procedureDetailFields"
  >
  </app-shared-details>
</div>
