<div class="page-container">

  <app-shared-table
    [title]="'Procedure'"
    [subtitle]="'Manage registered Doctors & Procedure'"
    [columns]="patientColumns"
    [data]="procedureList"
    [config]="tableConfig"
    (view)="onViewProcedure($event)"
    (createNewRecord)="openCreateForm()"
  >
  </app-shared-table>

  <p-dialog
    [(visible)]="showForm"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{
      width: '750px',
      maxWidth: '95vw',
    }"
    [header]="formMode === 'create' ? 'Create Procedure' : 'Edit Procedure'"
  >
    <app-procedure-form
      [mode]="formMode"
      [procedure]="selectedProcedure"
      (saved)="onProcedureSaved()"
      (cancelled)="onFormCancelled()"
    >
    </app-procedure-form>
  </p-dialog>

  <app-shared-details
    [(visible)]="viewDialogVisible"
    [title]="'Procedure Details'"
    [data]="selectedProcedure"
    [fields]="procedureDetailFields"
  >
  </app-shared-details>
</div>
