
<div class="page-container">

  <app-shared-table
  [title]="'Diagnosis '"
  [subtitle]="'Manage registered Doctors & Diagnosis'"
  [columns]="patientColumns"
  [data]="diagnosisList"
  [config]="tableConfig"

  (view)="onViewDiagnosis($event)"
  (createNewRecord)="openCreateForm()"
  >
  </app-shared-table>



  <p-dialog
    [(visible)]="showForm"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{
      width: '750px',
      maxWidth: '95vw'
    }"
    [header]="formMode === 'create'
      ? 'Create Diagnosis'
      : 'Edit Diagnosis'"
  >

    <app-diagnosis-form
      [mode]="formMode"
      [diagnosis]="selectedDiagnosis"
      (saved)="onDiagnosisSaved()"
      (cancelled)="onFormCancelled()"
    >
    </app-diagnosis-form>

  </p-dialog>

  <app-shared-details
  [(visible)]="viewDialogVisible"
  [title]="'Diagnosis Details'"
  [data]="selectedDiagnosis"
  [fields]="DiagnosisDetailFields">
</app-shared-details>
</div>
