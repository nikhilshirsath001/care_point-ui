<div class="chart-card">
  <div class="chart-header">
    <div>
      <h5>{{ title }}</h5>

      @if (subtitle) {
        <p>{{ subtitle }}</p>
      }
    </div>
  </div>

  <div class="chart-container" [style.height]="height">
    <p-chart
      [type]="type"
      [data]="chartData"
      [options]="chartOptions"
      [style]="{ width: '100%', height: '100%' }">
    </p-chart>
  </div>
</div>
